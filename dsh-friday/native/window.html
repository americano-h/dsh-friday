<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'">
  <title>Friday</title>
  <style>
    /* DSH design-platform palette for the standalone WebView. */
    :root { color-scheme: light dark; }
    :root[data-appearance="light"] { color-scheme: light; }
    :root[data-appearance="dark"] { color-scheme: dark; }
    :root {
      --dsw-alias-bg-base: rgb(255, 255, 255);
      --dsw-alias-bg-layer-1: rgb(255, 255, 255);
      --dsw-alias-bg-layer-2: rgb(255, 255, 255);
      --dsw-alias-bg-overlay: rgb(233, 236, 242);
      --dsw-alias-border-l1: rgba(0, 0, 0, 0.04);
      --dsw-alias-border-l2: rgba(0, 0, 0, 0.1);
      --dsw-alias-brand-primary: rgb(15, 17, 21);
      --dsw-alias-label-primary: rgb(15, 17, 21);
      --dsw-alias-label-secondary: rgb(97, 102, 107);
      --dsw-alias-state-error-primary: rgb(236, 19, 19);
      --dsw-alias-state-success-primary: rgb(34, 197, 94);
    }
    :root[data-dark] {
      --dsw-alias-bg-base: rgb(21, 21, 23);
      --dsw-alias-bg-layer-1: rgb(35, 35, 36);
      --dsw-alias-bg-layer-2: rgb(44, 44, 46);
      --dsw-alias-bg-overlay: rgb(97, 102, 107);
      --dsw-alias-border-l1: rgba(255, 255, 255, 0.06);
      --dsw-alias-border-l2: rgba(255, 255, 255, 0.12);
      --dsw-alias-brand-primary: rgb(249, 250, 251);
      --dsw-alias-label-primary: rgb(249, 250, 251);
      --dsw-alias-label-secondary: rgb(207, 211, 214);
      --dsw-alias-state-error-primary: rgb(242, 90, 90);
      --dsw-alias-state-success-primary: rgb(34, 197, 94);
    }
    html, body, #root { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; -webkit-font-smoothing: antialiased; user-select: none; }
    .df-native .df-quick { background: var(--dsw-alias-bg-layer-1); border: 1px solid var(--dsw-alias-border-l2); border-radius: 12px; box-shadow: none; }
    #root > .df-page { border-radius: 12px; border: 1px solid var(--dsw-alias-border-l1); }
    textarea, input, .df-markdown, .df-sources { user-select: text; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script defer src="./window.js"></script>
</body>
</html>
