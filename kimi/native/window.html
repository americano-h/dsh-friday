<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'">
  <title>Friday</title>
  <style>
    :root {
      color-scheme: light;
      --dsw-alias-bg-base: rgba(242, 242, 245, .72);
      --dsw-alias-bg-layer-1: #fff;
      --dsw-alias-bg-layer-2: rgba(232, 232, 237, .68);
      --dsw-alias-bg-overlay: rgba(246, 246, 249, .76);
      --dsw-alias-border-l1: rgba(30, 30, 40, .12);
      --dsw-alias-border-l2: rgba(30, 30, 40, .2);
      --dsw-alias-brand-primary: #6c5ce7;
      --dsw-alias-label-primary: rgba(28, 28, 32, .94);
      --dsw-alias-label-secondary: rgba(60, 60, 68, .64);
      --dsw-alias-state-error-primary: #c43d4b;
      --dsw-alias-state-idle-primary: #85858e;
      --dsw-alias-state-success-primary: #25865a;
      --dsw-alias-state-warn-primary: #a46b19;
    }
    html, body, #root { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; -webkit-font-smoothing: antialiased; user-select: none; }
    textarea, input, .df-markdown, .df-sources { user-select: text; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script defer src="./window.js"></script>
</body>
</html>
